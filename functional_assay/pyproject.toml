[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uma-functional-assay"
version = "0.2.0"
description = "Stitching, cell counts, and mask area in the UMA environment"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = ["uma-tools>=0.2.9,<0.3"]

[project.scripts]
uma_stitching = "functional_assay.stitching:main"
uma_cell_count = "functional_assay.cell_analysis:main"

[tool.setuptools]
packages = ["functional_assay"]
package-dir = {functional_assay = "."}
