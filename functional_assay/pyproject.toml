[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uma-functional-assay"
version = "0.1.0"
description = "Nine-tile ND2 stitching in the existing UMA-tools environment"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = ["uma-tools>=0.2.9,<0.3"]

[project.scripts]
uma_stitching = "functional_assay.stitching:main"

[tool.setuptools]
packages = ["functional_assay"]
package-dir = {functional_assay = "."}
