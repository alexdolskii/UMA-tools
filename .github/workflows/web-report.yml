name: Validate offline UMA report

on:
  pull_request:
    paths: ['code/**', 'tests/**', 'pyproject.toml', '.github/workflows/web-report.yml']
  push:
    branches: [UMA-tools-V2, 'ci/**']
    paths: ['code/**', 'tests/**', 'pyproject.toml', '.github/workflows/web-report.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      UMA_RUN_WEB_UI_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package and test-only DOM dependency
        shell: bash
        run: |
          python -m pip install . pytest
          npm install --prefix "$RUNNER_TEMP/uma-web-ui" jsdom@24.1.3 --no-audit --no-fund
          echo "NODE_PATH=$RUNNER_TEMP/uma-web-ui/node_modules" >> "$GITHUB_ENV"
      - name: Check command and offline data/UI contracts
        run: |
          uma_web_report --help
          uma_web_report --version
          python -m pytest tests/test_web_report.py -q --junitxml=web-report.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: offline-web-${{ matrix.os }}
          path: web-report.xml
