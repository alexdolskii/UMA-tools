name: Test

on:
  push:
    branches: [main, UMA-tools-V2]
  pull_request:
    branches: [main, UMA-tools-V2]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: false
          activate-environment: uma_tools
          environment-file: environment_uma.yaml

      - name: Install the package
        run: python -m pip install . "pytest>=8,<10"

      - name: Run the test suite
        env:
          UMA_RUN_IMAGEJ_TESTS: "1"
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v


      - name: Test Area revisions, guided reports and FIA integration
        env:
          MPLBACKEND: Agg
        run: >-
          python -m pytest tests/test_area_variants.py
          tests/test_report_options.py tests/test_report_nuclei.py -q
