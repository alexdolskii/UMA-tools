name: Lint and Format

on:
  push:
    branches: [main, UMA-tools-V2, 'ci/**']
  pull_request:
    branches: [main, UMA-tools-V2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active:
    name: Style - ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: main
            paths: code tests scripts
          - component: functional
            paths: functional_assay
          - component: nuclei
            paths: nuclei_layers_assay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github ${{ matrix.paths }}
      - name: Format
        if: ${{ !cancelled() }}
        run: ruff format --check ${{ matrix.paths }}

  archive-audit:
    name: Archived scripts - advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Record existing archive findings
        id: audit
        continue-on-error: true
        run: >-
          ruff check alternative_assays original_fibronectin_alignment_analysis
          --output-format=concise --output-file=archive-lint.txt
      - name: Explain advisory result
        if: ${{ !cancelled() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo '### Archived scripts (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo "Lint outcome: $AUDIT_OUTCOME. See archive-lint.txt." >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing findings remain visible; active packages are checked separately and must pass.' >> "$GITHUB_STEP_SUMMARY"
          cat archive-lint.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: archive-style-findings
          path: archive-lint.txt
