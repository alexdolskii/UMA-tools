[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uma-tools"
version = "0.2.6"
description = "Automated, headless workflows for fibroblast/ECM unit confocal data"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "matplotlib>=3.10.5,<3.11",
    "numpy==1.26.4",
    "openpyxl==3.1.5",
    "orientationpy==0.3.0",
    "pandas>=2.1.0,<3",
    "pillow>=10.1,<13",
    "pyimagej==1.5.0",
    "scikit-image==0.25.2",
    "scipy>=1.11.4,<1.16",
    "numba>=0.61,<0.62",
    "scyjava==1.10.0",
    "setuptools<81",
    "jgo==1.0.4",
]

[tool.setuptools.package-dir]
"" = "code"

[tool.setuptools.packages.find]
where = ["code"]
include = ["uma_tools", "uma_tools.*"]
namespaces = false

[project.scripts]
uma_alignment = "uma_tools.cli:alignment"
uma_thickness = "uma_tools.cli:thickness"
area_analysis = "uma_tools.cli:area"
uma_collect_results = "uma_tools.cli:collect_results"
uma_report = "uma_tools.cli:report"

[tool.ruff]
target-version = "py310"
line-length = 79
src = ["code"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
